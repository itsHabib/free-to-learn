<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc">
  <title id="title">Reconstructing a four-leaf state commitment from leaf C</title>
  <desc id="desc">C at index two is combined with sibling D on its right to form CD. CD is combined with sibling AB on its left. The top hash is then wrapped with leaf count four. Amber nodes are the supplied proof siblings. Green nodes are reconstructed.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8cae9c"/></marker></defs>
  <rect width="720" height="340" rx="12" fill="#14211c"/>
  <g stroke="#8cae9c" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M95 245 L200 190"/><path d="M255 245 L220 190"/><path d="M450 245 L500 190"/><path d="M625 245 L530 190"/>
    <path d="M215 140 L330 90"/><path d="M515 140 L390 90"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="19" text-anchor="middle">
    <rect x="270" y="30" width="180" height="60" rx="6" fill="#25563c" stroke="#a2e4bb"/><text x="360" y="55" fill="#edf4ee">top = H(AB, CD)</text><text x="360" y="78" font-size="14" fill="#a2e4bb">then bind count = 4</text>
    <rect x="145" y="140" width="140" height="50" rx="6" fill="#614321" stroke="#f4c899"/><text x="215" y="171" fill="#fff0dd">AB · sibling 2</text>
    <rect x="445" y="140" width="140" height="50" rx="6" fill="#25563c" stroke="#a2e4bb"/><text x="515" y="171" fill="#edf4ee">CD = H(C, D)</text>
    <rect x="50" y="245" width="90" height="45" rx="6" fill="#20302a" stroke="#658273"/><text x="95" y="274" fill="#c1d1c7">A</text>
    <rect x="210" y="245" width="90" height="45" rx="6" fill="#20302a" stroke="#658273"/><text x="255" y="274" fill="#c1d1c7">B</text>
    <rect x="400" y="245" width="100" height="45" rx="6" fill="#25563c" stroke="#a2e4bb"/><text x="450" y="274" fill="#edf4ee">C · index 2</text>
    <rect x="560" y="245" width="130" height="45" rx="6" fill="#614321" stroke="#f4c899"/><text x="625" y="274" fill="#fff0dd">D · sibling 1</text>
    <text x="360" y="324" font-size="15" fill="#bfd2c6">Use the index at each level: even → sibling right; odd → sibling left.</text>
  </g>
</svg>
