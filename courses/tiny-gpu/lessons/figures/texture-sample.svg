<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 390 736" width="390" height="736" role="img" aria-label="A 4 by 4 texture that repeats, with column 0 drawn again after column 3, read at (u, v) = (0.95, 0.4). Nearest sampling picks texel (3, 1), the one holding the point. Bilinear steps back half a texel and blends the four texel centres around the point, with weights 0.63 for texel (3, 1), 0.27 for texel (0, 1), 0.07 for texel (3, 2), 0.03 for texel (0, 2); the two in column 0 come from wrapping past the right edge.">
<style>
text { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  fill: #1f2328; font-size: 13px; }
.h { font-size: 16px; font-weight: 600; }
.s { font-size: 13px; fill: #57606a; }
.b { font-size: 13px; font-weight: 600; }
.k { font-size: 12px; fill: #1f2328; }
</style>
<desc>A 4 by 4 texture that repeats, with column 0 drawn again after column 3, read at (u, v) = (0.95, 0.4). Nearest sampling picks texel (3, 1), the one holding the point. Bilinear steps back half a texel and blends the four texel centres around the point, with weights 0.63 for texel (3, 1), 0.27 for texel (0, 1), 0.07 for texel (3, 2), 0.03 for texel (0, 2); the two in column 0 come from wrapping past the right edge.</desc>
<rect width="390" height="736" fill="#ffffff"/>
<text x="8" y="26" class="h">One sample, nearest and bilinear</text>
<text x="8" y="46" class="s">A 4 × 4 texture that repeats, read at (u, v) = (0.95, 0.4).</text>
<text x="8" y="62" class="s">Texel (x, y) is column x, row y. The dashed column is</text>
<text x="8" y="78" class="s">column 0 again, after column 3.</text>
<text x="8" y="108" class="b">Nearest: the texel that holds the point</text>
