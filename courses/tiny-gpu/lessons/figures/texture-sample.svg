<circle cx="282" cy="568" r="10.79" fill="#2f6fdb" fill-opacity="0.35" stroke="#2f6fdb"/>
<text x="282" y="593.7942286340599" class="b" text-anchor="middle">0.27</text>
<circle cx="226" cy="512" r="6.97" fill="#2f6fdb" fill-opacity="0.35" stroke="#2f6fdb"/>
<text x="226" y="500.0313730334031" class="b" text-anchor="middle">0.07</text>
<circle cx="282" cy="512" r="5.6" fill="#2f6fdb" fill-opacity="0.35" stroke="#2f6fdb"/>
<text x="282" y="501.4019237886467" class="b" text-anchor="middle">0.03</text>
<circle cx="242.79999999999998" cy="562.4" r="4.5" fill="#d9480f"/>
<text x="8" y="690" class="s">Half a texel back: x = 3.3, y = 1.1, so fx = 0.3, fy = 0.1.</text>
<text x="8" y="706" class="s">Weights: 0.63 + 0.27 + 0.07 + 0.03 = 1.</text>
<text x="8" y="722" class="s">Column 4 is past the edge, so it wraps to column 0.</text>
