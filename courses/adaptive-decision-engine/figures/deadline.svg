<svg xmlns="http://www.w3.org/2000/svg" width="340" height="410" viewBox="0 0 340 410" role="img" aria-labelledby="title"><title id="title">A late result has no effect</title><rect width="340" height="410" rx="12" fill="#e7ecdf"/><text x="170" y="28" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="700" fill="#213c32">A late result has no effect</text><rect x="15" y="48" width="310" height="64" rx="6" fill="#fffdf7" stroke="#7f9b83"/><text x="170" y="71" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#234439">Revision 8 · dispatch</text><text x="170" y="94" text-anchor="middle" font-family="system-ui" font-size="13" fill="#304b3b">reservation spent · token retained</text><path d="M170 115v13m-5-5 5 5 5-5" fill="none" stroke="#42664d" stroke-width="2"/><rect x="15" y="135" width="310" height="64" rx="6" fill="#fffdf7" stroke="#7f9b83"/><text x="170" y="158" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#234439">Deadline · fallback</text><text x="170" y="181" text-anchor="middle" font-family="system-ui" font-size="13" fill="#304b3b">commit rules once</text><path d="M170 202v13m-5-5 5 5 5-5" fill="none" stroke="#42664d" stroke-width="2"/><rect x="15" y="222" width="310" height="64" rx="6" fill="#fffdf7" stroke="#7f9b83"/><text x="170" y="245" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#234439">Revision 9</text><text x="170" y="268" text-anchor="middle" font-family="system-ui" font-size="13" fill="#304b3b">new state is authoritative</text><path d="M170 289v13m-5-5 5 5 5-5" fill="none" stroke="#42664d" stroke-width="2"/><rect x="15" y="309" width="310" height="64" rx="6" fill="#f6e2bc" stroke="#7f9b83"/><text x="170" y="332" text-anchor="middle" font-family="system-ui" font-size="16" font-weight="600" fill="#234439">Old result arrives</text><text x="170" y="355" text-anchor="middle" font-family="system-ui" font-size="13" fill="#304b3b">log stale · zero extra rounds</text></svg>
