<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>One-file world</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; background: #f3efe6; touch-action: none; -webkit-user-select: none; user-select: none; font: 13px system-ui, sans-serif; color: #4a4a48; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#fade { position: fixed; inset: 0; background: #f3efe6; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: opacity .9s; letter-spacing: .08em; }
#ui { position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 8px; opacity: .92; transition: opacity 1.2s; }
#ui.idle { opacity: .38; }
button { width: 40px; height: 40px; padding: 0; border: 1px solid #0000000f; border-radius: 50%; background: #ffffffd9; color: #55554f; display: grid; place-items: center; -webkit-tap-highlight-color: transparent; box-shadow: 0 1px 6px #0000001f; cursor: pointer; }
button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#bFly { position: fixed; left: max(14px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom)); width: 58px; height: 58px; display: none; opacity: .7; }
#hint { position: fixed; left: 0; right: 0; bottom: max(64px, env(safe-area-inset-bottom)); text-align: center; pointer-events: none; transition: opacity 1.5s; }
#hint span { background: #ffffffc9; padding: 5px 11px; border-radius: 12px; }
#cut { position: fixed; inset: 0; background: #0b1016; opacity: 0; pointer-events: none; }

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"><span></span></div>
<button id="bFly" title="Hold to fly forward" aria-label="Hold to fly forward"><svg viewBox="0 0 20 20"><path d="M10 4l5 11-5-2.5L5 15z"/></svg></button>
<div id="fade">growing an island</div>
<script>
'use strict';
// One-file world: an island coast at low sun, grown from the seed in the link.
// Every "(pure)" region below uses only numbers and typed arrays, so Node can
// run it without a browser. The world generators use only + - * / and
// Math.sqrt, Math.floor, Math.ceil, Math.imul, Math.abs, Math.min and Math.max:
// those give the same bits on every machine. Math.sin and friends may differ in
// the last bit between browsers, so they stay out of generation.

// region: core (pure)
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

// Integer hash of a grid point: the root of all randomness here.
function hash2(x, y, s) {
  let h =
    Math.imul(x, 0x27d4eb2d) ^
    Math.imul(y, 0x165667b1) ^
    Math.imul(s, 0x9e3779b1);
  h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
  return (h ^ (h >>> 16)) >>> 0;
}
// A stream of numbers in [0,1) from one integer (the "mulberry32" generator).
function rng(seed) {
  let a = seed | 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

// Gradient noise, about -1..1, smooth everywhere. Also writes its slope into
// D[0], D[1].
function noiseD(x, y, s, D) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
  const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
  const du = 30 * fx * fx * (fx * (fx - 2) + 1);
  const dv = 30 * fy * fy * (fy * (fy - 2) + 1);
  const h0 = hash2(ix, iy, s);
  const h1 = hash2(ix + 1, iy, s);
  const h2 = hash2(ix, iy + 1, s);
  const h3 = hash2(ix + 1, iy + 1, s);

  const ay = (h0 >>> 16) / 32768 - 1;
  const bx = (h1 & 65535) / 32768 - 1;
  const by = (h1 >>> 16) / 32768 - 1;
  const cx = (h2 & 65535) / 32768 - 1;
  const cy = (h2 >>> 16) / 32768 - 1;
  const dx = (h3 & 65535) / 32768 - 1;
  const dy = (h3 >>> 16) / 32768 - 1;
  const a = ax * fx + ay * fy;
  const b = bx * (fx - 1) + by * fy;

    ax +
    u * (bx - ax) +
    v * (cx - ax) +
    u * v * (ax - bx - cx + dx) +
    du * (b - a + v * k);

    ay +
    u * (by - ay) +
    v * (cy - ay) +
    u * v * (ay - by - cy + dy) +
    dv * (c - a + u * k);

const _D = [0, 0];
const noise = (x, y, s) => noiseD(x, y, s, _D);
// A unit vector from a random stream, without trigonometry.
function unitVec(r) {
  let x;
  let y;

  do {
    x = r() * 2 - 1;
    y = r() * 2 - 1;
    d = x * x + y * y;
  } while (d > 1 || d < 0.05);

// A tiling RGBA noise image for the shaders: R and G are cloudy, B is fine
// grain, A is static.
function noiseTile(n, seed) {
  const out = new Uint8Array(n * n * 4);
  // Smooth value noise that wraps every `cells` cells.
  const layer = (x, y, cells, s) => {
    const gx = (x * cells) / n;
    const gy = (y * cells) / n;
    const ix = Math.floor(gx);
    const iy = Math.floor(gy);
    const fx = gx - ix;
    const fy = gy - iy;
    const u = fx * fx * (3 - 2 * fx);
    const v = fy * fy * (3 - 2 * fy);
    const w = (i, j) =>
      hash2((ix + i) % cells, (iy + j) % cells, s) / 4294967296;
    return mix(mix(w(0, 0), w(1, 0), u), mix(w(0, 1), w(1, 1), u), v);
  };
  for (let y = 0, i = 0; y < n; y++)
    for (let x = 0; x < n; x++, i += 4) {
      let r = 0;
      let g = 0;
      let amp = 0.5;
      for (let o = 0, c = 4; o < 6; o++, c *= 2, amp *= 0.5) {
        r += amp * layer(x, y, c, seed + o);
        g += amp * layer(x, y, c, seed + 50 + o);
      }
      out[i] = clamp(r * 1.25 - 0.12, 0, 1) * 255;
      out[i + 1] = clamp(g * 1.25 - 0.12, 0, 1) * 255;
      out[i + 2] =
        (layer(x, y, 32, seed + 90) * 0.6 + layer(x, y, 64, seed + 91) * 0.4) *

      out[i + 3] = hash2(x, y, seed + 99) >>> 24;
    }

}
// endregion: core (pure)

// region: 1-camera (pure)
// The projection matrix: how the view narrows to a point at the eye.
// tanHalfY is the tangent of half the angle seen from top to bottom, aspect
// is width over height, and only what lies between near and far is kept.
function perspective(m, tanHalfY, aspect, near, far) {
  m.fill(0);
  // Scale x and y so that the edges of the view land on -1 and 1.
  m[0] = 1 / (tanHalfY * aspect);
  m[5] = 1 / tanHalfY;
  // Depth: near lands on -1 and far on 1, once divided by w.
  m[10] = (far + near) / (near - far);
  m[14] = (2 * far * near) / (near - far);
  // w becomes the distance ahead of the eye. Dividing by it makes far things
  // small.
  m[11] = -1;
  return m;
}
// The view matrix: it moves the world so that the camera sits at the origin
// and looks along -z. Yaw turns around the up axis, pitch tilts up and down.
// It also fills R, U and Fw with the camera's right, up and forward axes.
function viewMatrix(m, eye, yaw, pitch, R, U, Fw) {
  // Forward (fx, fy, fz): the way the camera faces.
  const level = Math.cos(pitch);
  const fx = Math.sin(yaw) * level;
  const fy = Math.sin(pitch);
  const fz = Math.cos(yaw) * level;
  // Right (rx, 0, rz): level, and square to forward.
  const toUnit = 1 / Math.sqrt(fx * fx + fz * fz);
  const rx = -fz * toUnit;
  const rz = fx * toUnit;
  // Up (ux, uy, uz): square to both.
  const ux = -rz * fy;
  const uy = rz * fx - rx * fz;
  const uz = rx * fy;

  // one axis: right, up, then backward, because the camera looks along -z.
  // Column 1: what each axis takes from the world's x.
  m[0] = rx;
  m[1] = ux;
  m[2] = -fx;
  m[3] = 0;
  // Column 2: what each axis takes from the world's y. Right is level.
  m[4] = 0;
  m[5] = uy;
  m[6] = -fy;
  m[7] = 0;
  // Column 3: what each axis takes from the world's z.
  m[8] = rz;
  m[9] = uz;
  m[10] = -fz;
  m[11] = 0;
  // Column 4 brings the eye to the origin: minus the eye, measured along
  // each axis.
  m[12] = -(rx * eye[0] + rz * eye[2]);
  m[13] = -(ux * eye[0] + uy * eye[1] + uz * eye[2]);
  m[14] = fx * eye[0] + fy * eye[1] + fz * eye[2];
  m[15] = 1;
  R[0] = rx;
  R[1] = 0;
  R[2] = rz;
  U[0] = ux;
  U[1] = uy;
  U[2] = uz;
  Fw[0] = fx;
  Fw[1] = fy;
  Fw[2] = fz;
  return m;
}
// o = a times b: applying o to a point is applying b, then a. c counts
// columns and r rows.
function mul4(o, a, b) {
  for (let c = 0; c < 4; c++)
    for (let r = 0; r < 4; r++)
      o[c * 4 + r] =
        a[r] * b[c * 4] +
        a[4 + r] * b[c * 4 + 1] +
        a[8 + r] * b[c * 4 + 2] +
        a[12 + r] * b[c * 4 + 3];
  return o;
}
// Yaw and pitch that look from eye to target.
function aim(eye, target) {
  const dx = target[0] - eye[0];
  const dy = target[1] - eye[1];
  const dz = target[2] - eye[2];
  // How far away the target is over the ground, leaving height out.
  const level = Math.sqrt(dx * dx + dz * dz);
  return [Math.atan2(dx, dz), Math.atan2(dy, level)];
}
// The six planes of the view volume, from the combined matrix: left, right,
// bottom, top, near, far. Each is four numbers a, b, c, d, and a point is on
// the inner side when a*x + b*y + c*z + d is 0 or more.
function frustumPlanes(out, m) {
  for (let i = 0; i < 6; i++) {
    // Planes come in pairs, one pair for each of x, y and z.
    const axis = i >> 1;
    const sign = i & 1 ? -1 : 1;
    // Row 4 of the matrix, plus or minus the row of that axis.
    for (let k = 0; k < 4; k++)
      out[i * 4 + k] = m[k * 4 + 3] + sign * m[k * 4 + axis];
  }
  return out;
}
// True when a box lies wholly outside one of the planes, so nothing in it can
// be seen. The box runs from (x0, y0, z0) to (x1, y1, z1).
function boxHidden(pl, x0, y0, z0, x1, y1, z1) {
  for (let i = 0; i < 24; i += 4) {
    // The corner of the box that reaches furthest to this plane's inner side.
    const x = pl[i] > 0 ? x1 : x0;
    const y = pl[i + 1] > 0 ? y1 : y0;
    const z = pl[i + 2] > 0 ? z1 : z0;
    // If even that corner is outside, the whole box is.
    if (pl[i] * x + pl[i + 1] * y + pl[i + 2] * z + pl[i + 3] < 0) return true;
  }
  return false;
}
// Free flight: thrust along the view, sideways and up, with drag, kept clear
// of the ground and the sea. fly = { v: [x, y, z] velocity } and
// push = [forward, right, up], each from -1 to 1.
function flyStep(eye, fly, F, R, push, boost, dt, H) {
  const speed = 26 * boost;
  const drag = Math.exp(-2.2 * dt);
  for (let c = 0; c < 3; c++) {
    const thrust = F[c] * push[0] + R[c] * push[1] + (c === 1 ? push[2] : 0);
    fly.v[c] = fly.v[c] * drag + thrust * speed * (1 - drag);
    eye[c] += fly.v[c] * dt;
  }
  // Stay within sight of the island.
  eye[0] = clamp(eye[0], -2250, 2250);
  eye[2] = clamp(eye[2], -2250, 2250);
  const ground = Math.max(heightAt(H, eye[0], eye[2]), 0);
  eye[1] = clamp(eye[1], ground + 2.2, 900);
}
// endregion: 1-camera (pure)

// region: frame
// What every layer shares: the canvas and the WebGL helpers, the numbers sent
// to every shader each frame, the camera's state, and three lists that layers
// add themselves to. No lesson edits this region. A layer joins in from its own
// "(page)" region by calling onGrow (build once), onTick (every frame, before
// drawing) and onDraw (every frame, in the order of the number given).
const Q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
// When anything fails, say so on the page and not only in the console. A
// function that is not written yet throws "its name: not written yet", and that
// line is what shows, in place of "growing an island".
function showFailure(e) {
  const note = document.getElementById('fade');
  note.textContent = String((e && e.message) || e)
    .split('\n')[0]
    .slice(0, 160);
  note.style.opacity = 1;
}
addEventListener('error', (e) => showFailure(e.error || e.message));
addEventListener('unhandledrejection', (e) => showFailure(e.reason));
const gl = canvas.getContext('webgl2', {
  antialias: true,
  alpha: false,
  powerPreference: 'high-performance',
});
const stat = { calls: 0, tris: 0, bytes: 0, ms: 0, scale: 1 };

function program(vs, fs) {
  const p = gl.createProgram();
  for (const [type, src] of [
    [gl.VERTEX_SHADER, vs],
    [gl.FRAGMENT_SHADER, fs],
  ]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error(
        gl.getShaderInfoLog(s) +
          '\n' +
          src
            .split('\n')
            .map((l, i) => i + 1 + ' ' + l)
            .join('\n'),
      );
    gl.attachShader(p, s);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw new Error(gl.getProgramInfoLog(p));
  gl.useProgram(p);
  const block = gl.getUniformBlockIndex(p, 'F');
  if (block !== gl.INVALID_INDEX) gl.uniformBlockBinding(p, block, 0);
  ['tH', 'tM', 'tS', 'tN', 'tW', 'tV'].forEach((name, unit) =>
    gl.uniform1i(gl.getUniformLocation(p, name), unit),
  );
  return p;
}
function texture(unit, internal, format, type, size, data, wrap, filter) {
  const t = gl.createTexture();
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, internal, size, size, 0, format, type, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

function buffer(target, data) {

// A mesh with plain float attributes: sizes lists how many numbers each
// attribute takes.

  sizes.forEach((size, loc) => {
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(
      loc,
      size,
      gl.FLOAT,
      false,
      stride,
      sizes.slice(0, loc).reduce((a, b) => a + b, 0) * 4,

    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, 32, k * 16);
    gl.vertexAttribDivisor(loc, 1);

const seed = Q.has('seed')
  ? parseInt(Q.get('seed')) >>> 0
  : (Math.random() * 1e6) | 0;
// The link names the island (some browsers refuse this for local files).
if (!Q.has('seed'))
  try {
    history.replaceState(null, '', '?seed=' + seed);
  } catch (e) {}
const SHOT = Q.has('shot');
const PHONE = matchMedia('(pointer: coarse)').matches;
const $ = (id) => document.getElementById(id);
// The grown world: layout, height grid, GPU objects; "detail" scales every
// detail distance.
const W = { detail: 1 };
const FB = new Float32Array(100);
const frameUbo = gl.createBuffer();
const proj = new Float32Array(16);
const view = new Float32Array(16);
const planes = new Float32Array(24);
const cam = {
  eye: [0, 60, -420],
  look: [0, 0, 0],
  yaw: 0,
  pitch: -0.1,
  R: [0, 0, 0],
  U: [0, 0, 0],
  F: [0, 0, 0],
};
let time = +(Q.get('t') || 0);
let frames = 0;
let lastNow = 0;
const tick = () => new Promise((r) => setTimeout(r));
const GROW = [];
const TICK = [];
const DRAW = [];
const onGrow = (f) => GROW.push(f);
const onTick = (f) => TICK.push(f);
const onDraw = (order, f) => DRAW.push([order, f]);

// The start of every shader: the numbers shared by all of them, and the six
// images they may read.
const GLSL_HEAD = `#version 300 es
precision highp float;
precision highp sampler2D;
layout(std140) uniform F {
  mat4 uVP;
  // Eye, time in seconds.
  vec4 uCam;
  // Camera right axis scaled to the screen edge, width in pixels.
  vec4 uRight;
  // Camera up axis scaled to the screen edge, height in pixels.
  vec4 uUp;
  // Camera forward, quality 0..1.
  vec4 uFwd;
  // Direction to the light, night 0..1.
  vec4 uSun;
  // Light colour, cloud cover.
  vec4 uSunCol;
  // Zenith sky, haze per metre.
  vec4 uZen;
  // Horizon sky, wind.
  vec4 uHor;
  // Exposure, tide, day 0..1.
  vec4 uMisc;
  // Jetty origin (world x,z) followed by local forward (x,z); zero before the
  // settlement exists.
  vec4 uHarbour;

vec3 harbourLamp(int i) {
  vec3 fixture = i == 0

      : i == 1
      ? vec3(15.5,4.12,-0.96)
      : i == 2
      ? vec3(34.2,4.12,-0.96)
      : vec3(29.6,9.86,5.42);

      + fixture.x * uHarbour.zw
      + fixture.z * vec2(-uHarbour.w,uHarbour.z);
  return vec3(p.x,fixture.y,p.y);

`;

// Grows the world: every layer's onGrow step in turn, with a pause between so
// the page stays alive.
async function start() {
  // Every image slot holds something from the start, so a shader written before
  // its layer exists still runs: black everywhere, except the shadow image,
  // which is white (nothing is in shadow).
  for (let unit = 0; unit < 6; unit++)
    texture(
      unit,
      gl.RGBA8,
      gl.RGBA,
      gl.UNSIGNED_BYTE,
      1,
      new Uint8Array(4).fill(unit === 2 ? 255 : 0),
      gl.CLAMP_TO_EDGE,
      gl.LINEAR,
    );
  texture(
    3,
    gl.RGBA8,
    gl.RGBA,
    gl.UNSIGNED_BYTE,
    256,
    noiseTile(256, 5),
    gl.REPEAT,
    gl.LINEAR_MIPMAP_LINEAR,
  );
  gl.bindBufferBase(gl.UNIFORM_BUFFER, 0, frameUbo);
  gl.bufferData(gl.UNIFORM_BUFFER, FB.byteLength, gl.DYNAMIC_DRAW);
  for (const step of GROW) {
    await step();
    await tick();
  }
  DRAW.sort((a, b) => a[0] - b[0]);
  requestAnimationFrame(frame);
}
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2) * stat.scale;
  const w = Math.max(2, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(2, Math.round(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

// One frame: let every layer update, work out the camera, send the shared
// numbers, then let every layer draw.
function frame(now) {
  const real = Math.min((now - lastNow) / 1000, 0.1);
  const dt = SHOT ? 0 : real;
  lastNow = now;
  time += dt;
  stat.t0 = performance.now();
  for (const f of TICK) f(dt, real);
  resize();
  stat.calls = stat.tris = 0;
  // A little longer lens when upright.
  const aspect = canvas.width / canvas.height;
  const tanY = (0.52 / Math.sqrt(aspect)) * (aspect < 1 ? 0.88 : 1);
  perspective(proj, tanY, aspect, 0.6, 20000);
  viewMatrix(view, cam.eye, cam.yaw, cam.pitch, cam.R, cam.U, cam.F);
  mul4(FB, proj, view);
  frustumPlanes(planes, FB);
  FB.set(cam.eye, 16);
  FB[19] = time;
  for (let i = 0; i < 3; i++) {
    FB[20 + i] = cam.R[i] * tanY * aspect;
    FB[24 + i] = cam.U[i] * tanY;
    FB[28 + i] = cam.F[i];
  }
  FB[23] = canvas.width;
  FB[27] = canvas.height;
  FB[31] = PHONE ? 0 : 1;
  gl.bindBuffer(gl.UNIFORM_BUFFER, frameUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, FB);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LEQUAL);
  gl.depthMask(true);
  gl.disable(gl.BLEND);
  // A plain sky, until the light layer draws a real one over it.
  gl.clearColor(0.6, 0.72, 0.86, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  for (const pass of DRAW) pass[1](dt, real);
  // Test switch: wait for the GPU to finish, so frames cannot overlap.
  if (Q.has('bench') && frames > 20 && frames < 20 + 40) {
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array(4));
    stat.bench = (stat.bench || 0) + (performance.now() - stat.t0) / 39;
    if (frames < 20 + 39) {
      frames++;
      return frame(now);
    }
  }
  if (++frames === 3) {
    $('fade').style.opacity = 0;
    window.__ready = true;
  }
  requestAnimationFrame(frame);
}
// endregion: frame

// stub: level ground (replaced by 2-land)
// The ground is a level plane one metre above the sea, two kilometres across,
// laid as 32 by 32 square tiles of 64 m. A tile that boxHidden says is out of
// view is not drawn. The count in the corner of the page shows how many tiles
// were drawn this frame: it changes as you turn, and the picture should not.
function heightAt(H, x, z) {
  return 1;
}
onGrow(() => {
  const TILE = 64;
  const SIDE = 32;
  const p = program(
    GLSL_HEAD +
      `
// The tile's corner (x, z) and the length of its side.
uniform vec3 uTile;
out vec3 vP;
void main() {
  vec2 q = vec2(gl_VertexID & 1, gl_VertexID >> 1);
  vP = vec3(uTile.x + q.x * uTile.z, 1.0, uTile.y + q.y * uTile.z);
  gl_Position = uVP * vec4(vP, 1.0);
}`,
    GLSL_HEAD +
      GLSL_SKY +
      GLSL_LIGHT +
      GLSL_FILM +
      `
in vec3 vP;
out vec4 o;
// How strongly a ruled line every "every" metres covers this pixel: 1 on the
// line, 0 away from it.
float ruled(float every, float width) {
  vec2 g = 0.5 - abs(fract(vP.xz / every) - 0.5), w = fwidth(vP.xz / every);
  return 1.0 - smoothstep(0.0, width, min(g.x / w.x, g.y / w.y));
}
void main() {
  // Fine lines every 16 m, a heavier one round each tile.
  float line = max(0.45 * ruled(16.0, 1.2), ruled(64.0, 2.0));
  vec3 colour = mix(vec3(0.5, 0.52, 0.5), vec3(0.2, 0.22, 0.24), line);
  vec3 lit = colour * lightOn(vec3(0.0, 1.0, 0.0), 1.0, 1.0);
  o = vec4(finish(haze(lit, vP)), 1.0);
}`,
  );
  const uTile = gl.getUniformLocation(p, 'uTile');
  // A small box in the top left corner of the page holds the count.
  const boxStyle =
    'position: fixed; left: max(8px, env(safe-area-inset-left)); ' +
    'top: max(8px, env(safe-area-inset-top)); padding: 5px 9px; ' +
    'border-radius: 6px; background: #ffffffc9; pointer-events: none; ' +
    'font: 12px ui-monospace, monospace';
  document.body.insertAdjacentHTML(
    'beforeend',
    `<div id="tiles" style="${boxStyle}"></div>`,
  );
  let shown = -1;
  onDraw(20, () => {
    gl.bindVertexArray(null);
    gl.useProgram(p);
    let drawn = 0;
    for (let k = 0; k < SIDE * SIDE; k++) {
      const x0 = ((k % SIDE) - SIDE / 2) * TILE;
      const z0 = (Math.floor(k / SIDE) - SIDE / 2) * TILE;
      // The tile is a box with no height.
      if (boxHidden(planes, x0, 1, z0, x0 + TILE, 1, z0 + TILE)) continue;
      gl.uniform3f(uTile, x0, z0, TILE);
      draw(gl.TRIANGLE_STRIP, 4, 0);
      drawn++;
    }
    if (drawn !== shown) {
      shown = drawn;
      $('tiles').textContent = `tiles drawn: ${drawn} of ${SIDE * SIDE}`;
    }
  });
});
// endstub: level ground

// stub: flat light (replaced by 3-light)
// One fixed light from above and to one side, a plain sky colour, no haze, no
// shadows, no film curve.
const GLSL_SKY = `
vec3 skyBase(vec3 d) {
  return vec3(0.6, 0.72, 0.86);
}
float cloudShade(vec3 p) {
  return 1.0;
}
vec3 haze(vec3 col, vec3 p) {
  return col;
}
`;
const GLSL_LIGHT = `
vec3 lightOn(vec3 n, float sky, float sun) {
  return vec3(0.35 + 0.65 * max(dot(n, vec3(0.42, 0.8, 0.42)), 0.0));
}
`;
const GLSL_FILM = `
float grain(vec2 p) {
  return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
}
vec3 finish(vec3 c) {
  return pow(clamp(c, 0.0, 1.0), vec3(1.0 / 2.2));
}
`;
// endstub: flat light

// stub: still blue sea (replaced by 4-water)
// A flat blue sheet at sea level, a little see-through, and a sea bed that
// simply turns blue with depth.
const GLSL_SEA = `
vec3 throughWater(vec3 bed, float depth, float lookDown) {
  return mix(vec3(0.03, 0.16, 0.28), bed, exp(-depth * 0.35));
}
float caustics(vec2 p) {
  return 0.0;
}
`;
onGrow(() => {
  const p = program(
    GLSL_HEAD +
      `
out vec3 vP;
void main() {
  vec2 q = vec2(gl_VertexID & 1, gl_VertexID >> 1) * 2.0 - 1.0;
  vP = vec3(uCam.x + q.x * 16000.0, 0.0, uCam.z + q.y * 16000.0);
  gl_Position = uVP * vec4(vP, 1.0);
}`,
    GLSL_HEAD +
      GLSL_SKY +
      GLSL_LIGHT +
      GLSL_FILM +
      `
in vec3 vP;
out vec4 o;
void main() {
  vec3 blue = vec3(0.03, 0.16, 0.28) * lightOn(vec3(0.0, 1.0, 0.0), 1.0, 1.0);
  o = vec4(finish(haze(blue, vP)), 0.82);
}`,
  );
  onDraw(70, () => {
    gl.bindVertexArray(null);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    gl.useProgram(p);
    draw(gl.TRIANGLE_STRIP, 4, 0);
  });
});
// endstub: still blue sea

// stub: bare ground (replaced by 5-erosion)
// No rain has fallen and nothing grows: the land keeps its first smooth shape
// and is one grey all over.
function erode(H, E, drops, seed) {
  return H;
}
function coverMasks(H, L, E) {
  return new Uint8Array(N * N * 4);
}
const GLSL_GROUND = `
vec3 ground(vec3 vP, vec4 L, vec4 M, out vec3 n, out float wet) {
  n = normalize(vec3(L.g, 1.0, L.b));
  wet = 0.0;
  return vec3(0.42, 0.41, 0.39);
}
`;
// endstub: bare ground

// stub: still air (replaced by 7-motion)
// Nothing moves: every point of every thing stays where it was built.
const GLSL_WIND = `
vec3 windMove(vec3 p, vec4 ext, vec4 at, vec4 own) {
  return p;
}
`;
// endstub: still air

// The shaders follow, as text, ordered so that each can use the pieces before
// it: light, water, ground, land, motion, things.
// region: 1-camera (page)
// Free flight: drag to look; W A S D, the arrow keys, two fingers or the
// on-screen button to move. The camera itself (where it is, which way it looks)
// is "cam" in the frame region.
const ctl = {
  mode: 'fly',
  keys: {},
  touches: new Map(),
  fly: { v: [0, 0, 0] },
  push: [0, 0, 0],
  hold: false,
};
onTick((dt) => {
  if (ctl.mode !== 'fly') return;
  const K = ctl.keys;
  const two = ctl.touches.size >= 2 || ctl.hold ? 1 : 0;
  ctl.push[0] =
    (K.KeyW || K.ArrowUp ? 1 : 0) - (K.KeyS || K.ArrowDown ? 1 : 0) + two;
  ctl.push[1] =
    (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
  ctl.push[2] = (K.KeyE || K.Space ? 1 : 0) - (K.KeyQ || K.KeyC ? 1 : 0);
  flyStep(
    cam.eye,
    ctl.fly,
    cam.F,
    cam.R,
    ctl.push,
    K.ShiftLeft || K.ShiftRight ? 4 : 1,
    dt,
    W.H,
  );
});
canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  ctl.touches.set(e.pointerId, [e.clientX, e.clientY]);
  $('hint').style.opacity = 0;
});
canvas.addEventListener('pointermove', (e) => {
  const p = ctl.touches.get(e.pointerId);
  if (!p) return;
  // Drag the view: the scene follows the finger.
  const k = 0.0042 / ctl.touches.size;
  cam.yaw -= (e.clientX - p[0]) * k;
  cam.pitch = clamp(cam.pitch + (e.clientY - p[1]) * k, -1.4, 1.4);
  p[0] = e.clientX;
  p[1] = e.clientY;
});
for (const type of ['pointerup', 'pointercancel'])
  canvas.addEventListener(type, (e) => ctl.touches.delete(e.pointerId));
addEventListener('keydown', (e) => {
  // With Ctrl, Cmd or Alt a key is the browser's.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Space on a focused button presses the button.
  if (e.code === 'Space' && e.target.tagName === 'BUTTON') return;
  ctl.keys[e.code] = true;
  if (/^(Key[WASDQEC]|Arrow|Space)/.test(e.code)) {
    $('hint').style.opacity = 0;
    e.preventDefault();
  }
});
addEventListener('keyup', (e) => {
  ctl.keys[e.code] = false;
});
addEventListener('blur', () => {
  ctl.keys = {};
});
for (const [type, on] of [
  ['pointerdown', true],
  ['pointerup', false],
  ['pointercancel', false],
  ['pointerleave', false],
])
  $('bFly').addEventListener(type, (e) => {
    ctl.hold = on;
    e.preventDefault();
  });
// On that button, Enter and Space do what a finger does.
$('bFly').addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (!/^(Space|Enter|NumpadEnter)$/.test(e.code)) return;
  ctl.hold = true;
  e.preventDefault();
});
$('bFly').addEventListener('keyup', (e) => {
  if (/^(Space|Enter|NumpadEnter)$/.test(e.code)) ctl.hold = false;
});
$('bFly').addEventListener('blur', () => {
  ctl.hold = false;
});
if (PHONE) $('bFly').style.display = 'grid';
$('hint').firstElementChild.textContent = PHONE
  ? 'drag to look · two fingers to fly'
  : 'drag to look · W A S D to fly';
setTimeout(() => {
  $('hint').style.opacity = 0;
}, 9000);
if (SHOT) $('hint').style.display = $('bFly').style.display = 'none';
// Where the camera starts: at cam.eye (set in the frame region), turned to look
// at a point on the ground 588 m ahead. aim() works out the yaw and pitch that
// do that. A later layer may choose its own start the same way.
[cam.yaw, cam.pitch] = aim(cam.eye, [0, 1, 168]);
// endregion: 1-camera (page)

start();
</script>
