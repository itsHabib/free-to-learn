<text x="375" y="161" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">update</text>
<text x="30" y="195" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">r3</text>
<text x="120" y="195" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">A 41</text>
