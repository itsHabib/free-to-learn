<text x="375" y="127" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">enter</text>
<text x="30" y="161" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">r2</text>
<text x="120" y="161" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">A 41</text>
