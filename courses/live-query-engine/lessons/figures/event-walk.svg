<svg xmlns="http://www.w3.org/2000/svg" width="480" height="256" viewBox="0 0 480 256" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">Order A across four commits</title>
<desc id="d">Order A starts at 18 and is absent from the board. r1 writes 45: A is visible and the desk gets a enter; r2 writes 41: A is visible and the desk gets an update; r3 writes 41: A is visible and the desk gets nothing; r4 writes 30: A is absent and the desk gets a leave.</desc>
<rect width="480" height="256" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5c6865"/></marker></defs>
<text x="16" y="24" font-weight="600">Order A on the packing desk (quantity &gt; 30)</text>
<text x="30" y="56" font-size="13" fill="#5c6865">revision</text>
<text x="120" y="56" font-size="13" fill="#5c6865">A in the store</text>
<text x="230" y="56" font-size="13" fill="#5c6865">on the board?</text>
<text x="340" y="56" font-size="13" fill="#5c6865">event</text>
