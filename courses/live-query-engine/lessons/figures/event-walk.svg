<text x="120" y="127" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">A 45</text>
<rect x="230" y="112" width="76" height="22" fill="#d8ece8" stroke="#1f6f68"/>
<text x="268" y="127" text-anchor="middle" font-size="13">visible</text>
