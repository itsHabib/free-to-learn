<svg xmlns="http://www.w3.org/2000/svg" width="480" height="274" viewBox="0 0 480 274" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">The skewed capture by input pair</title>
<desc id="d">The skewed capture scored by lab.py: 97 wins in 100 trials, S = 2. Inputs 00: 33 trials, every pair of answers equal, correlation 1. Inputs 01: 32 trials, every pair of answers equal, correlation 1. Inputs 10: 32 trials, every pair of answers equal, correlation 1. Inputs 11: 3 trials, every pair of answers equal, correlation 1. Equal answers win on 00, 01 and 10 and lose on 11, so the pooled 97% comes from the three common pairs. S adds the first three correlations and subtracts the fourth: 1 + 1 + 1 − 1 = 2.</desc>
<rect width="480" height="274" fill="#ffffff"/>
<text x="16" y="24" font-weight="600">skewed-classical.csv: 97 of 100 wins, S = 2</text>
<text x="16" y="56" font-size="13" fill="#5c6865">inputs</text>
<text x="70" y="56" font-size="13" fill="#5c6865">trials (all answers equal)</text>
<text x="384" y="56" font-size="13" fill="#5c6865">correlation</text>
<line x1="16" y1="64" x2="464" y2="64" stroke="#c9d2cf"/>
<text x="16" y="93" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="600">00</text>
<rect x="70" y="76" width="200" height="24" fill="#d8ece8" stroke="#1f6f68"/>
<text x="276" y="93" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">33 (all win)</text>
<text x="384" y="93" font-family="ui-monospace, Menlo, Consolas, monospace">+1.0</text>
<text x="16" y="131" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="600">01</text>
<rect x="70" y="114" width="193.94" height="24" fill="#d8ece8" stroke="#1f6f68"/>
<text x="269.93939393939394" y="131" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">32 (all win)</text>
<text x="384" y="131" font-family="ui-monospace, Menlo, Consolas, monospace">+1.0</text>
<text x="16" y="169" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="600">10</text>
<rect x="70" y="152" width="193.94" height="24" fill="#d8ece8" stroke="#1f6f68"/>
<text x="269.93939393939394" y="169" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">32 (all win)</text>
<text x="384" y="169" font-family="ui-monospace, Menlo, Consolas, monospace">+1.0</text>
<text x="16" y="207" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="600">11</text>
<rect x="70" y="190" width="18.18" height="24" fill="#fbe9e7" stroke="#b3261e"/>
<text x="94.18181818181819" y="207" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">3 (all lose)</text>
<text x="384" y="207" font-family="ui-monospace, Menlo, Consolas, monospace">+1.0</text>
<text x="16" y="240" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">S = 1 + 1 + 1 − 1 = 2</text>
<text x="16" y="260" font-size="12.5" fill="#5c6865">The pooled 97% comes from three common input pairs; 11 came up 3 times.</text>
</svg>
