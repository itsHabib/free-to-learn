<title id="t">Six-state sweep at two stations</title>
<desc id="d">Pass probability for each of the six preparations with the known-good receiver, from teleport/bench.py. End to end at the day station: all six pass 100%. End to end at the night station: zero, one, plus, minus pass 100% and plus-i and minus-i, basis Y, pass 0%. Prepared directly at the night verifier, bypassing Alice, the pair, the message and Bob: plus-i and minus-i fail.</desc>
