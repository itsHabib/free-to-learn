<text x="185.2894" y="217" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">14.6%</text>
<text x="372" y="211" font-size="12.5">if different</text>
<text x="372" y="226" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#1f6f68">85.4%</text>
<text x="16" y="250" font-size="12.5" fill="#5c6865">Each input pair wins 85.4% of the time.</text>
