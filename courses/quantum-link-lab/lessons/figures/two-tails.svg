<title id="t">Tail probability for two 80% reports</title>
<desc id="d">Two bar charts of how many rounds a strategy that wins each round with probability 3/4 would win. With 10 rounds, the bars from 8 to 10 are shaded: it reaches 8 or more 52.6% of the time. With 245 rounds, the bars from 196 up are shaded, far out in the right tail: 3.9%. Both reports are 80%. The tails come from lab.py's uniform_null.</desc>
