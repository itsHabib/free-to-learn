<svg xmlns="http://www.w3.org/2000/svg" width="480" height="358" viewBox="0 0 480 358" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">Same number of nulls, different place in the batch</title>
<desc id="d">Both importers from race --shift --seed 1901 run under fixedRule in 256-row batches: 4,096 rows in 16 batches, one null in each batch. Batch 0 is interpreted in both because there is no history. In &quot;null first&quot; the null is row 0 of each batch, so every later batch hits the guard before any row and is interpreted: 0 Wasm rows, 15 exits. In &quot;null last&quot; the null is the batch's last row, so 255 rows of each later batch run in Wasm first: 3,825 Wasm rows, 15 exits. Same exits, very different work in Wasm.</desc>
