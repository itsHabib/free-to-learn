<svg xmlns="http://www.w3.org/2000/svg" width="480" height="319" viewBox="0 0 480 319" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">fixedRule's answer by rows remaining and nulls</title>
<desc id="d">Two maps of fixedRule's answer, by rows still to process (0 to 1,024) and nulls in the previous 256-row batch (0 to 16). With nothing compiled yet it chooses compile only when at least 512 rows remain and the previous batch had at most 8 nulls. With a predicate already built the row count no longer matters: it compiles whenever the previous batch had at most 8 nulls. Marked: the opening case (768 rows, 2 nulls, nothing built) chooses compile; an 80-row tail chooses interpret with nothing built and compile with a predicate built. The first batch has no history and always chooses interpret.</desc>
<rect width="480" height="319" fill="#ffffff"/>
<text x="16" y="24" font-weight="600">What fixedRule chooses after a 256-row batch</text>
<text x="152" y="54" text-anchor="middle" font-size="13" font-weight="600">nothing compiled yet</text>
