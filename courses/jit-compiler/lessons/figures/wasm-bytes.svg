<svg xmlns="http://www.w3.org/2000/svg" width="480" height="340" viewBox="0 0 480 340" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">quantity &gt; -70 as WebAssembly bytes</title>
<desc id="d">The program load, const -70, gt as the reference compiler emits it. load becomes 20 00 (local.get 0); const -70 becomes 41 then BA 7F (i32.const -70); gt becomes 4A (i32.gt_s). The literal -70 needs 2 bytes of signed LEB128: 10111010 and 01111111. The first bit of each byte says whether another byte follows; the other seven are payload, the lowest 7-bit group first, each byte drawn high bit first; the second bit of the last byte, its highest payload bit, is the sign. The whole module is 42 bytes (header 8, type 8, function 4, export 10, code 12), of which 6 are the instructions.</desc>
<rect width="480" height="340" fill="#ffffff"/>
<text x="16" y="24" font-weight="600">quantity &gt; -70, compiled to WebAssembly bytes</text>
<text x="116" y="52" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">['load']</text>
<rect x="70" y="62" width="46" height="28" fill="#f3f5f4" stroke="#1f2b29"/>
<text x="93" y="81" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace">20</text>
