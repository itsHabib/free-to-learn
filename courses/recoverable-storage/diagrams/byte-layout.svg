<svg xmlns="http://www.w3.org/2000/svg" width="760" viewBox="0 0 760 334" role="img" aria-label="A frame cursor advances by byte counts, not characters"><title >A frame cursor advances by byte counts, not characters</title><desc >bytes 0–3: IVY1 | 4–7: body length | 8–11: checksum; byte 12: opcode | 13–16: tx | 17–18: key length; bytes 19–22: value length; key bytes 23–25; then value bytes 26–27</desc><rect width="760" height="334" fill="#fbfaf5"/><text x="24" y="34" font-family="system-ui" font-size="23" fill="#18302c">A frame cursor advances by byte counts, not characters</text><rect x="20" y="56" width="720" height="52" rx="5" fill="#eaf0e6" stroke="#4e7d70"/><text x="32" y="89" font-family="ui-monospace,monospace" font-size="20" fill="#18302c">bytes 0–3: IVY1 | 4–7: body length | 8–11: checksum</text><rect x="20" y="118" width="720" height="52" rx="5" fill="#eaf0e6" stroke="#4e7d70"/><text x="32" y="151" font-family="ui-monospace,monospace" font-size="20" fill="#18302c">byte 12: opcode | 13–16: tx | 17–18: key length</text><rect x="20" y="180" width="720" height="52" rx="5" fill="#eaf0e6" stroke="#4e7d70"/><text x="32" y="213" font-family="ui-monospace,monospace" font-size="20" fill="#18302c">bytes 19–22: value length</text><rect x="20" y="242" width="720" height="52" rx="5" fill="#eaf0e6" stroke="#4e7d70"/><text x="32" y="275" font-family="ui-monospace,monospace" font-size="20" fill="#18302c">key bytes 23–25; then value bytes 26–27</text></svg>
