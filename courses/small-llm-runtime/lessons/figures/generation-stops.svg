<svg xmlns="http://www.w3.org/2000/svg" width="480" height="208" viewBox="0 0 480 208" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">Two generations and their stop reasons</title>
<desc id="d">The reference generate on prompt [4,3,5] (&quot;a b&quot;) with 8 new tokens and seed 1. Position 3: token 4; Position 4: token 8; Position 5: token 10; Position 6: token 29; Position 7: token 18; Position 8: token 23; Position 9: token EOS. It generates 7 tokens and stops with &quot;eos&quot;. With a 31-token prompt and the same settings it generates 1 token at position 31 and stops with &quot;context&quot;.</desc>
<rect width="480" height="208" fill="#ffffff"/>
<text x="16" y="24" font-weight="600">generate(prompt [4,3,5], 8 new tokens, seed 1)</text>
