<text x="155" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">8</text>
<text x="208" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">5</text>
<rect x="184" y="80" width="46" height="28" fill="#d8ece8" stroke="#1f6f68"/>
<text x="207" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">10</text>
<text x="260" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">6</text>
<rect x="236" y="80" width="46" height="28" fill="#d8ece8" stroke="#1f6f68"/>
<text x="259" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">29</text>
<text x="312" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">7</text>
<rect x="288" y="80" width="46" height="28" fill="#d8ece8" stroke="#1f6f68"/>
<text x="311" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">18</text>
<text x="364" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">8</text>
<rect x="340" y="80" width="46" height="28" fill="#d8ece8" stroke="#1f6f68"/>
<text x="363" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">23</text>
<text x="416" y="67" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">9</text>
<rect x="392" y="80" width="46" height="28" fill="#f6e3cf" stroke="#a65a17"/>
<text x="415" y="99" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">EOS</text>
