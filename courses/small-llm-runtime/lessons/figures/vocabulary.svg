<svg xmlns="http://www.w3.org/2000/svg" width="480" height="290" viewBox="0 0 480 290" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">Vocabulary and one encoding</title>
<desc id="d">A grid of the 32 vocabulary entries by ID: 0 EOS, 1 unknown, 2 newline, 3 space, 4 to 29 the letters a to z, 30 period, 31 comma. &quot;a b&quot; encodes code point by code point to [4, 3, 5]: a is 4, the space is 3, b is 5. Decoding gives back &quot;a b&quot;.</desc>
