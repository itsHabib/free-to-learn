<svg xmlns="http://www.w3.org/2000/svg" width="480" height="310" viewBox="0 0 480 310" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2b29">
<title id="t">Streaming: each token is delivered before the next decode</title>
<desc id="d">The order of runtime calls and events when a consumer pulls streamGenerate's events one at a time: call prefill (3 prompt tokens), call sample (token 4), event token (index 0, token 4), call decodeStep (4 at pos 3), call sample (token 8), event token (index 1, token 8), call decodeStep (8 at pos 4), call sample (token 10), event token (index 2, token 10), event complete (stop limit). Each token event reaches the consumer before the decode for the next token begins.</desc>
<rect width="480" height="310" fill="#ffffff"/>
<text x="16" y="24" font-weight="600">streamGenerate(prompt [4,3,5], 3 new tokens, seed 1)</text>
<text x="16" y="48" font-size="12.5" fill="#5c6865">runtime call</text>
<text x="260" y="48" font-size="12.5" fill="#5c6865">event the consumer pulls</text>
<line x1="16" y1="56" x2="464" y2="56" stroke="#c9d2cf"/>
<rect x="16" y="64" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="79" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">prefill: 3 prompt tokens</text>
<rect x="16" y="88" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="103" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">sample: token 4</text>
<rect x="260" y="112" width="204" height="20" fill="#d8ece8" stroke="#1f6f68"/>
<text x="266" y="127" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">token: index 0, token 4</text>
<rect x="16" y="136" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="151" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">decodeStep: 4 at pos 3</text>
<rect x="16" y="160" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="175" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">sample: token 8</text>
<rect x="260" y="184" width="204" height="20" fill="#d8ece8" stroke="#1f6f68"/>
<text x="266" y="199" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">token: index 1, token 8</text>
<rect x="16" y="208" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="223" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">decodeStep: 8 at pos 4</text>
<rect x="16" y="232" width="204" height="20" fill="#f3f5f4" stroke="#5c6865"/>
<text x="22" y="247" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">sample: token 10</text>
<rect x="260" y="256" width="204" height="20" fill="#d8ece8" stroke="#1f6f68"/>
<text x="266" y="271" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">token: index 2, token 10</text>
<rect x="260" y="280" width="204" height="20" fill="#d8ece8" stroke="#1f6f68"/>
<text x="266" y="295" font-size="12.5" font-family="ui-monospace, Menlo, Consolas, monospace">complete: stop limit</text>
</svg>
