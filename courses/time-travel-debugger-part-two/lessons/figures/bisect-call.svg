<svg xmlns="http://www.w3.org/2000/svg" width="400" height="412" viewBox="0 0 400 412" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Bisection inside call 29</title>
<desc id="d">Bisection inside call 29 of lesson 09's tampered recording, 796 instructions long. One row per test, in order; the shaded bar is the interval still in question, which starts as 0 to 796, and the mark is the offset tested: t = 398, differs; t = 199, differs; t = 99, differs; t = 49, equal; t = 74, equal; t = 86, equal; t = 92, equal; t = 95, equal; t = 97, equal; t = 98, equal. Each test keeps the half whose ends are still equal and different, until the ends are one instruction apart at 98 and 99. Memory first differs 99 instructions into the call, at tick 96,469 + 99 = 96,568.</desc>
