<svg xmlns="http://www.w3.org/2000/svg" width="400" height="308" viewBox="0 0 400 308" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Find the call where two runs part</title>
<desc id="d">Step 1 of the search, on lesson 09's tampered recording, whose answer 12 was changed. Calls are drawn as cells from call 0. The tampered recording is replayed one call at a time, and after each call its memory hash is compared with the hash the original recording kept. Calls 0 to 28 end with the same hash. Call 29 is the first whose hash differs, so the scan stops there; the remaining calls, of 759, are never replayed. Step 2 then searches inside call 29 alone: 796 instructions from tick 96,469, where memory is equal and the state saved at the call's start is the same in both runs, to tick 97,265, where memory differs.</desc>
