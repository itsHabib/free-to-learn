<svg xmlns="http://www.w3.org/2000/svg" width="400" height="513" viewBox="0 0 400 513" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">The chain of the store at tick 89,345</title>
<desc id="d">The chain of the store at tick 89,345, the shell position written at g + 40 on the first game frame of the first flight, call 20, in lesson 09's recording. Each arrow points from a value to what it was computed from. The position at tick 89,345 comes from the shell position stored at tick 88,529 and the horizontal speed stored at tick 88,553, both in call 19, and from answer 3, server_wind. The position at tick 88,529 comes from the cannon position, g + 20, stored at tick 69,167, and from answer 1, cos. The speed comes from answer 1 too and from the power at g + 4 stored by the last press of up, in call 12. That store comes from the press before it, and so on through 11 presses of up in calls 2 to 12; the first comes from two stores game_init made in call 0: the key at g + 92, tick 69,157, and the angle and power, an 8-byte store at g + 0, tick 69,170. 16 stores and 2 answers in all. An input reached through another store on the chain is drawn only there.</desc>
