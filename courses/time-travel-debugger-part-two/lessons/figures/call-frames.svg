<svg xmlns="http://www.w3.org/2000/svg" width="400" height="330" viewBox="0 0 400 330" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">The call stack through call 13</title>
<desc id="d">How many frames the machine holds at each position from the snapshot at tick 84,000 to the end of call 13, a call to game_tick in lesson 09's recording. The snapshot falls inside call 12, which holds 2 frames there (update_hud and game_key) and has returned by 84,111, where call 13 begins. game_tick's frame is the only one until 84,156; from 84,157 to 84,826 update_hud's frame sits on top of it, two frames; from 84,827 game_tick runs alone again, and at 84,832 the call has returned and there are none. The function stop on update_hud fires at 84,157, where update_hud's instruction 0 runs next. finish stops at 84,827, the first position with fewer frames than at the stop. Below, rcontinue from 84,827: it restores the snapshot at 84,000, replays 826 instructions noting each stop, then restores again and replays 157 to stand at the stop, 983 instructions in all.</desc>
<rect width="400" height="330" fill="#ffffff"/>
<defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f8f"/></marker></defs>
<text x="16" y="22" font-weight="600">The call stack through call 13</text>
<text x="16" y="40" font-size="13" fill="#6f685d">how many frames the machine holds at each position</text>
<line x1="124" y1="150" x2="384" y2="150" stroke="#c9c1b4" stroke-dasharray="2 3"/>
<text x="116" y="154" text-anchor="end" font-size="12">0 frames</text>
<line x1="124" y1="116" x2="384" y2="116" stroke="#c9c1b4" stroke-dasharray="2 3"/>
<text x="116" y="120" text-anchor="end" font-size="12">1 frame</text>
<line x1="124" y1="82" x2="384" y2="82" stroke="#c9c1b4" stroke-dasharray="2 3"/>
<text x="116" y="86" text-anchor="end" font-size="12">2 frames</text>
<text x="277.59" y="76" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace">update_hud</text>
<path d="M124 82 L158.06 82 L158.38 82 L158.38 116 L158.38 116 L158.69 116 L158.69 150 L158.69 150 L159 150 L159 116 L172.75 116 L173.06 116 L173.06 82 L382.13 82 L382.44 82 L382.44 116 L383.69 116 L384 116 L384 150 L384 150" fill="none" stroke="#2b2620" stroke-width="2"/>
<line x1="124" y1="60" x2="124" y2="166" stroke="#6f685d" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="124" y="182" text-anchor="end" font-size="12" fill="#6f685d">snapshot</text>
<text x="124" y="195" text-anchor="end" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6f685d">84,000</text>
<line x1="158.69" y1="60" x2="158.69" y2="166" stroke="#6f685d" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="158.69" y="212" text-anchor="end" font-size="12" fill="#6f685d">call 13 begins</text>
<text x="158.69" y="225" text-anchor="end" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#6f685d">84,111</text>
<line x1="173.06" y1="60" x2="173.06" y2="166" stroke="#b5541c" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="173.06" y="182" text-anchor="start" font-size="12" fill="#b5541c">stop: update_hud begins</text>
<text x="173.06" y="195" text-anchor="start" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#b5541c">84,157</text>
<line x1="382.44" y1="60" x2="382.44" y2="166" stroke="#2f6f8f" stroke-width="1.2" stroke-dasharray="4 2"/>
<text x="382.44" y="212" text-anchor="end" font-size="12" fill="#2f6f8f">finish</text>
<text x="382.44" y="225" text-anchor="end" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#2f6f8f">84,827</text>
<text x="16" y="250" font-size="12" font-weight="600">rcontinue from 84,827 back to the stop:</text>
<line x1="126" y1="264" x2="380.13" y2="264" stroke="#2f6f8f" stroke-width="2" marker-end="url(#f)"/>
<text x="16" y="282" font-size="12" fill="#2f6f8f">restore the snapshot, replay 826 noting each stop</text>
<line x1="126" y1="296" x2="171.06" y2="296" stroke="#2f6f8f" stroke-width="2" marker-end="url(#f)" stroke-dasharray="5 3"/>
<text x="16" y="314" font-size="12" fill="#2f6f8f">restore again, replay 157 to the stop: 983 in all</text>
</svg>
