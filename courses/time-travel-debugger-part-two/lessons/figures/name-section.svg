<svg xmlns="http://www.w3.org/2000/svg" width="400" height="244" viewBox="0 0 400 244" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Where the names sit in lob-names.wasm</title>
<desc id="d">Where the function names sit in targets/lob-names.wasm. Top, to scale: the whole file of 7,271 bytes, 8 fixed bytes, then 9 standard sections, most of it the code section of 5,957 bytes, then 3 custom sections with id 0, 589 bytes in all: name, 372 bytes; producers, 66 bytes; target_features, 151 bytes. Middle, not to scale: the custom section &quot;name&quot;: its id 0, its size 369, its own name &quot;name&quot;, then subsections 0 (size 15), 1 (size 312), 7 (size 18), 9 (size 10); the walk reads subsection 1 and skips the others by their sizes.</desc>
