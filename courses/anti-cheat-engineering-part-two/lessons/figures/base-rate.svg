<svg xmlns="http://www.w3.org/2000/svg" width="400" height="338" viewBox="0 0 400 338" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#22282b">
<title id="t">Precision at a base rate of 1 in 100</title>
<desc id="d">A tree of 10,000 sessions when 1 in 100 is a cheat: 100 cheats and 9,900 legal sessions. With recall 0.9, 90 cheats are flagged and 10 are not; with a false positive rate of 0.01, 99 legal sessions are flagged and 9,801 are not. The flagged list holds 189 sessions, 90 of them cheats: precision 0.476.</desc>
<rect width="400" height="338" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5f6a70"/></marker></defs>
<text x="16" y="22" font-weight="600">10,000 sessions, 1 in 100 a cheat</text>
<text x="16" y="39" font-size="12" fill="#5f6a70">recall 0.9, false positive rate 0.01</text>
<rect x="105" y="52" width="190" height="40" fill="#eef2f3" stroke="#c4ccd0" rx="4"/>
<text x="200" y="77" font-size="13" font-weight="600" text-anchor="middle">10,000 sessions</text>
<rect x="16" y="124" width="178" height="40" fill="#dbe9f0" stroke="#2f6f8f" rx="4"/>
<text x="105" y="149" font-size="13" font-weight="600" text-anchor="middle">100 cheats</text>
<rect x="206" y="124" width="178" height="40" fill="#eef2f3" stroke="#c4ccd0" rx="4"/>
<text x="295" y="149" font-size="13" font-weight="600" text-anchor="middle">9,900 legal</text>
<line x1="200" y1="92" x2="105" y2="122" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="200" y1="92" x2="295" y2="122" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<rect x="16" y="196" width="85" height="40" fill="#2f6f8f" stroke="#2f6f8f" rx="4"/>
<text x="58.5" y="213" font-size="13" font-weight="600" text-anchor="middle" fill="#ffffff">90</text>
<text x="58.5" y="229" font-size="12" text-anchor="middle" fill="#ffffff">flagged</text>
<rect x="109" y="196" width="85" height="40" fill="#f6f8f8" stroke="#c4ccd0" rx="4"/>
<text x="151.5" y="213" font-size="13" font-weight="600" text-anchor="middle">10</text>
<text x="151.5" y="229" font-size="12" text-anchor="middle" fill="#5f6a70">not</text>
<rect x="206" y="196" width="85" height="40" fill="#f7e1dc" stroke="#b23a2a" rx="4"/>
<text x="248.5" y="213" font-size="13" font-weight="600" text-anchor="middle">99</text>
<text x="248.5" y="229" font-size="12" text-anchor="middle" fill="#5f6a70">flagged</text>
<rect x="299" y="196" width="85" height="40" fill="#f6f8f8" stroke="#c4ccd0" rx="4"/>
<text x="341.5" y="213" font-size="13" font-weight="600" text-anchor="middle">9,801</text>
<text x="341.5" y="229" font-size="12" text-anchor="middle" fill="#5f6a70">not</text>
<line x1="105" y1="164" x2="58.5" y2="194" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="105" y1="164" x2="151.5" y2="194" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="295" y1="164" x2="248.5" y2="194" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="295" y1="164" x2="341.5" y2="194" stroke="#5f6a70" stroke-width="1.4" marker-end="url(#a)"/>
<text x="16" y="268" font-size="13" font-weight="600">the flagged list: 189 sessions</text>
<rect x="16" y="276" width="175.24" height="26" fill="#2f6f8f"/>
<rect x="191.24" y="276" width="192.76" height="26" fill="#f7e1dc" stroke="#b23a2a"/>
<text x="24" y="294" font-size="12" fill="#ffffff" font-weight="600">90 cheats</text>
<text x="376" y="294" font-size="12" text-anchor="end" fill="#b23a2a" font-weight="600">99 legal</text>
<text x="16" y="324" font-size="13" font-weight="600">precision: 90 / 189 = 0.476</text>
</svg>
