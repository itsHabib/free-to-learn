<svg xmlns="http://www.w3.org/2000/svg" width="400" height="446" viewBox="0 0 400 446" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#22282b">
<title id="t">Which defence each budget measures</title>
<desc id="d">Five defences on the left, one for each of lessons 12 to 16, and the scoreboard's nine budgets on the right, joined by a line wherever a missed budget sends you back to that defence. protocol cheats' cheating inputs all refused: admission (lesson 12). legal inputs refused only as stale: admission (lesson 12). experts hit at least 18%: admission (lesson 12) and view (lesson 13). searcher hits at most 75%: view (lesson 13). legal: at most 1 in 125 sessions flagged: detector (lesson 14). searcher: at least 90% of sessions flagged: detector (lesson 14). honest presses refused at most 1%: judge, window (lesson 15). naive lies accepted at most 1%: judge, window (lesson 15). every item in one inventory, no coin made or lost: trade, recover (lesson 16).</desc>
<rect width="400" height="446" fill="#ffffff"/>
<text x="16" y="22" font-weight="600">Which defence each budget measures</text>
<text x="16" y="39" font-size="12" fill="#5f6a70">a line: a miss sends you back to that lesson</text>
