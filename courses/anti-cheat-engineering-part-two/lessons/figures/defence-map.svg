<path d="M134 244 C 174 244, 180 286, 220 286" fill="none" stroke="#2f6f8f" stroke-width="1.3"/>
<path d="M134 324.5 C 174 324.5, 180 328, 220 328" fill="none" stroke="#2f6f8f" stroke-width="1.3"/>
<path d="M134 324.5 C 174 324.5, 180 370, 220 370" fill="none" stroke="#2f6f8f" stroke-width="1.3"/>
<path d="M134 405 C 174 405, 180 412, 220 412" fill="none" stroke="#2f6f8f" stroke-width="1.3"/>
