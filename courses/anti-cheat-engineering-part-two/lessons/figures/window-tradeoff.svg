<title id="t">Every window, priced in two errors</title>
<desc id="d">Two bar charts over windows 0 to 8, from the sweep's table for seed 1. Honest presses refused although in range at seen, as a share of honest presses: window 0 20.77%, window 1 17.67%, window 2 11.9%, window 3 7.86%, window 4 4.67%, window 5 3.84%, window 6 1.96%, window 7 0.24%, window 8 0%. Brackets mark the windows within the budgets 1%, from window 7 and 2%, from window 6. The slow-pong faker's presses accepted while out of range now, as a share of its presses: window 0 0%, window 1 0%, window 2 0%, window 3 9%, window 4 23%, window 5 40%, window 6 62%, window 7 91%, window 8 100%. Windows 10 and 12 read as window 8.</desc>
