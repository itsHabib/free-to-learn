<text x="16" y="39" font-size="12" fill="#5f6a70">the core at x = 2,000 mm; boxes: the courier's x in metres</text>
<text x="16" y="54" font-size="12" fill="#5f6a70">at the end of each tick; it walks east 250 mm a tick</text>
<text x="16" y="89" font-size="13" font-weight="600">server</text>
<text x="16" y="74" font-size="12" fill="#5f6a70">tick</text>
<text x="16" y="257" font-size="13" font-weight="600">client</text>
<text x="16" y="274" font-size="12" fill="#5f6a70">ms</text>
