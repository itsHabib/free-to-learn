<text x="36" y="300" font-size="12">within 250 mm of the core</text>
<text x="16" y="324" font-size="13" font-weight="600" fill="#b23a2a">window 0, at now: tick 10, x = 2,500, refused</text>
<text x="16" y="342" font-size="13" font-weight="600" fill="#2c7a4b">window 2: back to tick 8, x = 2,250, accepted</text>
