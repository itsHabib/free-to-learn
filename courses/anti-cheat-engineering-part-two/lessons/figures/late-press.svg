<svg xmlns="http://www.w3.org/2000/svg" width="400" height="356" viewBox="0 0 400 356" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#22282b">
<title id="t">Question 15a's press at two windows</title>
<desc id="d">A timeline of one press, with the server above and the client below, 100 ms each way. Tick boundaries every 50 ms; under each tick, the courier's x at the end of it, ticks 5 to 10: 1,500, 1,750, 2,000, 2,250, 2,500, 2,500 mm. The core is at 2,000, so the courier is in range at 1,750, 2,000, 2,250. The view of tick 6, x = 1,750, the first in range, reaches the client at 400 ms; the client sends stop and interact with seen 6, which arrives at 500 ms and is admitted for tick 10. Judged at now (window 0), the courier stands at 2,500, 500 mm past the core, and the press is refused (range). With window 2 the judge looks back to tick 8, where the courier stood at 2,250, and accepts.</desc>
<rect width="400" height="356" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2f6f8f"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b23a2a"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2c7a4b"/></marker></defs>
