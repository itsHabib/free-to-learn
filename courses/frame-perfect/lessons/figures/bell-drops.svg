<svg xmlns="http://www.w3.org/2000/svg" width="400" height="382" viewBox="0 0 400 382" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">The bell room and the drop for each wait</title>
<desc id="d">The bell room drawn from its level file: the start at the bottom, the bell just above and to its right, and the four places the bell can drop a block, numbered 0 to 3 along row 7, at columns 3, 10, 14, 18; drop 3 is the one that opens a shorter way up. Below, for 0 to 12 idle frames before a plan of 6 frames right then 10 of jump, the drop the bell picks: 2, 1, 1, 2, 0, 3, 1, 0, 1, 2, 2, 2, 3. The first with drop 3 is 5 idle frames.</desc>
<rect width="400" height="382" fill="#ffffff"/>
<text x="8" y="24" font-weight="600">The bell room and its four drops</text>
<text x="8" y="44" fill="#6f685d" font-size="13">Hit from below, the bell drops a block in one of the</text>
<text x="8" y="62" fill="#6f685d" font-size="13">dashed places. Only drop 3 opens a shorter way up.</text>
