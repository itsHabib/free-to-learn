<title id="t">Input sequences against distinct states</title>
<desc id="d">A chart with a logarithmic scale of the number of input sequences of up to d frames and of distinct states within 0 to 12 frames of level 1's start. Sequences multiply by six each frame and reach about 2.61 billion within 12 frames. Distinct states, with the key that leaves out the random state, reach only 17,089; with the random state kept in the key, 62,399.</desc>
