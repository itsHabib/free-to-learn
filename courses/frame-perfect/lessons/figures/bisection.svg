<svg xmlns="http://www.w3.org/2000/svg" width="400" height="376" viewBox="0 0 400 376" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Bisection finds the first frame two versions disagree</title>
<desc id="d">Bisection on the 109-frame level 1 movie played on versions 1.0 and 1.1. One row per probe, in order: frame 54, agree; frame 81, agree; frame 95, agree; frame 102, disagree; frame 98, disagree; frame 96, agree; frame 97, disagree. The gap still in question halves with each probe, from 0 to 109 down to one frame, and frame 97 is the first disagreement.</desc>
<rect width="400" height="376" fill="#ffffff"/>
<text x="8" y="24" font-weight="600">Bisection on the 109-frame level 1 movie</text>
<text x="8" y="44" fill="#6f685d">Each bar is the gap still in question; the tick is the probe.</text>
<text x="22" y="74">1. frame 54: agree, so lo = 54</text>
<rect x="22" y="80" width="358" height="8" fill="#c9c1b4"/>
<line x1="199.36" y1="77" x2="199.36" y2="91" stroke="#2f6f8f" stroke-width="2.5"/>
<text x="22" y="110">2. frame 81: agree, so lo = 81</text>
<rect x="199.36" y="116" width="180.64" height="8" fill="#c9c1b4"/>
<line x1="288.04" y1="113" x2="288.04" y2="127" stroke="#2f6f8f" stroke-width="2.5"/>
<text x="22" y="146">3. frame 95: agree, so lo = 95</text>
<rect x="288.04" y="152" width="91.96" height="8" fill="#c9c1b4"/>
<line x1="334.02" y1="149" x2="334.02" y2="163" stroke="#2f6f8f" stroke-width="2.5"/>
<text x="22" y="182">4. frame 102: disagree, so hi = 102</text>
<rect x="334.02" y="188" width="45.98" height="8" fill="#c9c1b4"/>
<line x1="357.01" y1="185" x2="357.01" y2="199" stroke="#b5541c" stroke-width="2.5"/>
<text x="22" y="218">5. frame 98: disagree, so hi = 98</text>
<rect x="334.02" y="224" width="22.99" height="8" fill="#c9c1b4"/>
<line x1="343.87" y1="221" x2="343.87" y2="235" stroke="#b5541c" stroke-width="2.5"/>
<text x="22" y="254">6. frame 96: agree, so lo = 96</text>
<rect x="334.02" y="260" width="9.85" height="8" fill="#c9c1b4"/>
<line x1="337.3" y1="257" x2="337.3" y2="271" stroke="#2f6f8f" stroke-width="2.5"/>
<text x="22" y="290">7. frame 97: disagree, so hi = 97</text>
<rect x="337.3" y="296" width="6.57" height="8" fill="#c9c1b4"/>
<line x1="340.59" y1="293" x2="340.59" y2="307" stroke="#b5541c" stroke-width="2.5"/>
<line x1="22" y1="320" x2="380" y2="320" stroke="#2b2620"/>
<line x1="22" y1="320" x2="22" y2="325" stroke="#2b2620"/>
<text x="22" y="340" text-anchor="start" fill="#6f685d">0</text>
<line x1="199.36" y1="320" x2="199.36" y2="325" stroke="#2b2620"/>
<text x="199.36" y="340" text-anchor="middle" fill="#6f685d">54</text>
<line x1="340.59" y1="320" x2="340.59" y2="325" stroke="#2b2620"/>
<text x="340.59" y="340" text-anchor="middle" fill="#6f685d">97</text>
<line x1="380" y1="320" x2="380" y2="325" stroke="#2b2620"/>
<text x="380" y="340" text-anchor="end" fill="#6f685d">109</text>
<text x="22" y="362" fill="#b5541c" font-weight="600">First disagreement: frame 97, after 7 probes</text>
</svg>
