<svg xmlns="http://www.w3.org/2000/svg" width="400" height="518" viewBox="0 0 400 518" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Kettle's RAM, byte by byte</title>
<desc id="d">Kettle's 32 bytes of RAM after 12 frames of holding right on room 0, as 4 rows of 8 bytes, each with its address and value, labelled by the field it belongs to: frame at 0x00 to 0x01, x at 0x02 to 0x03, y at 0x04 to 0x05, vx at 0x06 to 0x07, vy at 0x08 to 0x09, flags at 0x0a, random at 0x0b to 0x0c, gems at 0x0d, item slots at 0x0e to 0x11, done at 0x12, dead at 0x13, drop at 0x14, bell at 0x15, taken at 0x16, and bytes 0x17 to 0x1f unused. The frame counter reads 12, x is 408 sub-pixels (25.5 px), vx is 24 (1.5 px a frame), and drop is 255 because no bell has rung.</desc>
<rect width="400" height="518" fill="#ffffff"/>
<text x="8" y="24" font-weight="600">Kettle's RAM after 12 frames of right</text>
<text x="8" y="44" fill="#6f685d" font-size="13">On room 0. Each box is one of the 32 bytes: its</text>
<text x="8" y="62" fill="#6f685d" font-size="13">address above, its value inside.</text>
<rect x="16" y="86" width="46" height="34" fill="#f3ede3" stroke="#c9c1b4"/>
