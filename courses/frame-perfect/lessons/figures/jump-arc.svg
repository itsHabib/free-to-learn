<svg xmlns="http://www.w3.org/2000/svg" width="400" height="292" viewBox="0 0 400 292" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">A jump held and a jump let go after one frame</title>
<desc id="d">Two jumps from standing, as height above the floor after each frame. Jump held: Kettle rises 18 px, is highest on frames 8 and 9, and is back at floor height on frame 17. Jump let go after frame 1: the rise is cut on frame 2, Kettle tops out at 4.5 px and lands on frame 7.</desc>
