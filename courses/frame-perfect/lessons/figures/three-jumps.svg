<svg xmlns="http://www.w3.org/2000/svg" width="400" height="382" viewBox="0 0 400 382" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#2b2620">
<title id="t">Three tries at one jump from one savestate</title>
<desc id="d">Level 1's start, with the step one tile high three tiles right of Kettle. From a savestate after frame 2, three tries jump on frames 3, 4 and 5, each drawn as Kettle's feet after every frame: the jump on frame 3 lands on frame 20, on the floor in front of the step; the jump on frame 4 lands on frame 18, on top of the step; the jump on frame 5 lands on frame 19, on top of the step.</desc>
<rect width="400" height="382" fill="#ffffff"/>
<text x="8" y="24" font-weight="600">Three tries at one jump, from one savestate</text>
<text x="8" y="44" fill="#6f685d" font-size="13">Level 1's start; the dashed box is where Kettle</text>
<text x="8" y="62" fill="#6f685d" font-size="13">starts. Saved after frame 2. Each dot is the middle</text>
<text x="8" y="80" fill="#6f685d" font-size="13">of Kettle's feet after one frame; each box is Kettle,</text>
<text x="8" y="98" fill="#6f685d" font-size="13">6 px wide, where it lands.</text>
