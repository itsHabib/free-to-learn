<text x="380" y="192" font-size="22" text-anchor="middle" fill="#1a7f37" font-weight="700">found</text>
<text x="480" y="192" font-size="22" text-anchor="middle" fill="#1b1f24">65,524</text>
<text x="585" y="192" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<text x="670" y="192" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<text x="20" y="236" font-size="22">power up key</text>
