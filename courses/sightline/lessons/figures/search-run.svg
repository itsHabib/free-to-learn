<text x="480" y="104" font-size="22" text-anchor="middle" fill="#1b1f24">65,536</text>
<text x="585" y="104" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<text x="670" y="104" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<text x="20" y="148" font-size="22">angle up key</text>
<text x="380" y="148" font-size="22" text-anchor="middle" fill="#1b1f24" font-weight="700">2</text>
<text x="480" y="148" font-size="22" text-anchor="middle" fill="#1b1f24" font-weight="700">65,524</text>
<text x="585" y="148" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<text x="670" y="148" font-size="22" text-anchor="middle" fill="#57606a">–</text>
<rect x="12" y="162" width="696" height="44" fill="#f6f8fa"/>
