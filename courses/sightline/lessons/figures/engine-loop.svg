<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="el-t el-d" font-family="system-ui, sans-serif" font-size="22" fill="#1b1f24">
<title id="el-t">The engine's loop</title>
<desc id="el-d">The engine's loop, top to bottom. Code checks the kit against the game. If nothing is missing or wrong, the engine plays the level's scored rounds; it also plays when a problem is left and nothing that could fix it fits what is left of the allowance. If there is a problem, code lists the options that could fix it, each with an estimated cost in rounds and shots, and only those that fit what is left of the allowance. The decision model picks one; your rule or option 0 can stand in for it. The engine tests the pick against the game, paying for the test from the level's allowance. A confirmed part goes into the kit; a refuted one does not, and is not offered again on that level. Either way the kit is checked again.</desc>
<g fill="#f6f8fa" stroke="#57606a" stroke-width="2">
