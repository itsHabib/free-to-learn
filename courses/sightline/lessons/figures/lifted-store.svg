<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" role="img" aria-labelledby="ls-t ls-d" font-family="system-ui, sans-serif" font-size="22" fill="#1b1f24">
<title id="ls-t">The store that lowers the angle, as a tree</title>
<desc id="ls-d">The store game_key makes for key code 1, the key that lowers the angle, drawn as a tree. At the root is the place it writes, i*0x13120: the angle's word, field +0 of the struct whose address is kept at 0x13120. Below it is the value it writes, (k ^ asbits((asfloat((k ^ a)) + -1))), with k the load of i*0x13120+92 and a the load of i*0x13120: an XOR of k with asbits of a sum, the sum adding -1 to asfloat of an XOR of k with a. k is drawn once, with two edges into it: it is loaded once and both XORs use it. Beside the tree is the store's guard in words: it runs when the key code is not 6, the flying flag is not set, the key code is 1 and the angle is above 5.</desc>
<g stroke="#57606a" stroke-width="2" fill="none">
