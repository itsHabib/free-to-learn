<text x="190" y="422" font-size="22" font-weight="700" text-anchor="end">8</text>
<text x="206" y="422" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace">game_tick</text>
<text x="444" y="422" font-size="22">entry 4</text>
<text x="590" y="422" font-size="22">type 4</text>
<text x="190" y="462" font-size="22" font-weight="700" text-anchor="end">9</text>
<text x="206" y="462" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace">r_angle</text>
