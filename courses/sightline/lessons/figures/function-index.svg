<text x="590" y="462" font-size="22">type 2</text>
<text x="206" y="502" font-size="22" fill="#57606a">… 18 more exported functions, 10 to 27</text>
<rect x="142" y="514" width="558" height="40" fill="#f6f8fa"/>
<text x="190" y="542" font-size="22" font-weight="700" text-anchor="end">28</text>
