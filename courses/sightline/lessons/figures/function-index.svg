<text x="444" y="542" font-size="22">entry 24</text>
<text x="590" y="542" font-size="22">type 6</text>
<path d="M138 78 H126 V230 H138" fill="none" stroke="#57606a" stroke-width="3"/>
<text x="116" y="162" font-size="22" font-weight="700" text-anchor="end" fill="#57606a">imports</text>
<path d="M138 238 H126 V550 H138" fill="none" stroke="#3553d4" stroke-width="3"/>
<text x="116" y="376" font-size="22" font-weight="700" text-anchor="end" fill="#3553d4">defined</text>
<text x="116" y="402" font-size="22" font-weight="700" text-anchor="end" fill="#3553d4">in the</text>
<text x="116" y="428" font-size="22" font-weight="700" text-anchor="end" fill="#3553d4">file</text>
<text x="20" y="586" font-size="22" fill="#57606a">entry: its place in the import or the function section</text>
<text x="20" y="616" font-size="22" fill="#3553d4">a defined function's entry is its index − 4</text>
</svg>
