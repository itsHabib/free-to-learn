<text x="444" y="342" font-size="22">entry 2</text>
<text x="590" y="342" font-size="22">type 4</text>
<text x="190" y="382" font-size="22" font-weight="700" text-anchor="end">7</text>
<text x="206" y="382" font-size="22" font-family="ui-monospace, Menlo, Consolas, monospace">game_key</text>
<text x="444" y="382" font-size="22">entry 3</text>
<text x="590" y="382" font-size="22">type 5</text>
