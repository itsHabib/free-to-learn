<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="sf-t sf-d" font-family="system-ui, sans-serif" font-size="24" fill="#1b1f24">
<title id="sf-t">How a shell flies</title>
<desc id="sf-d">The cannon stands at cannonX. Its barrel turns about a point that is the launch height above the ground, and the angle is measured up from level. The shell starts at the tip of the barrel, not at the left edge and not on the ground. From there it moves across at vx and up at vy, while gravity pulls it down and the wind pushes it sideways, until its height reaches 0.</desc>
